[pytest]
# 为什么要这个文件（2026-09-21 加）：
# 工作区里放了教材参考副本 _ref/ai-agent-book/（书里的 109 个配套实验都在里面，
# 自带一堆 test_*.py 和它自己的 .venv）。pytest 默认会递归收集整个工作区，
# 于是把那些第三方测试也收进来 → 10 个 collection error，把本工作区自己的
# 27 passed 淹掉。
#
# 注意：一旦显式写了 norecursedirs，pytest 的**默认值会被覆盖**，
# 所以必须把它们原样抄回来，再追加我们要忽略的目录。
# pytest 默认值：*.egg .* _darcs build CVS dist node_modules venv {arch}
norecursedirs = *.egg .* _darcs build CVS dist node_modules venv {arch} _ref _备份

testpaths = .
